<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fairy Purple Music ♡</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    linear-gradient(
      rgba(250, 245, 255, 0.88),
      rgba(250, 245, 255, 0.88)
    ),
    url("https://i.postimg.cc/QdgG0P3R/file-0000000019448243a74efbbe546f8890.png")
    center / cover fixed;

  font-family: Georgia, "Times New Roman", serif;
  color: #5D456F;
}

.fp-player {
  width: 100%;
  min-height: 100vh;
  padding: 25px 18px 20px;
  text-align: center;
}

/* ✧ Decoration */

.fp-decoration {
  color: #9B7BB8;
  font-size: 16px;
  letter-spacing: 4px;
  margin-bottom: 10px;
}

/* ♡ Title */

.fp-title {
  color: #79558F;
  font-size: 27px;
  font-style: italic;
  font-weight: normal;
  margin: 0 0 6px;
}

.fp-subtitle {
  color: #A98AC1;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

/* 🎵 Spotify box */

.fp-music-box {
  background: #FBF8FE;
  border: 1px dashed #C9AFE8;
  border-radius: 7px;
  padding: 9px;
  box-shadow:
    0 8px 25px rgba(122, 91, 155, 0.15);
}

.fp-music-box iframe {
  display: block;
  width: 100%;
  height: 380px;
  border: 0;
  border-radius: 5px;
}

/* 🦋 Footer */

.fp-footer {
  margin-top: 18px;
  color: #A98AC1;
  font-size: 11px;
  font-style: italic;
  letter-spacing: 1px;
  line-height: 1.5;
}

.fp-footer-decoration {
  margin-bottom: 5px;
  color: #9B7BB8;
  letter-spacing: 3px;
}

</style>

</head>

<body>

<div class="fp-player">

  <div class="fp-decoration">
    🦋 ✧ 🌙 ✧ 🦋
  </div>

  <h1 class="fp-title">
    Fairy Purple Music ♡
  </h1>

  <div class="fp-subtitle">
    ✧ music for little moments ✧
  </div>

  <div class="fp-music-box">

    <iframe
      src="https://open.spotify.com/embed/playlist/63NOUWPd74DWUF08hVBDDQ?utm_source=generator&theme=0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>

  </div>

  <div class="fp-footer">

    <div class="fp-footer-decoration">
      🦋 ✧ ♡ ✧ 🦋
    </div>

    enjoy the music while exploring Fairy Purple

  </div>

</div>

</body>
</html>
